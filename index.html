<script>if (!/^#r\d/.test(location.hash) && !matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('intro');</script>
<style>
/* Layout (round 3, camera B): the page is the floor. No rules; every robot is rendered by one shared camera
   (85 mm, 4.5 m, eye 45 cm) with its real shadow, so they share a scale and a horizon. The robots are ONE compact tile
   that opens a full-width band under its row. Single light look on purpose: this mocks the site itself. */
:root {
  --paper: #f0f0ec; --ink: #151514; --mute: #84857f; --line: #cfd0c9; --ghost: #e4e4df; --red: #de2910;
  /* Breul Grotesk everywhere (his pick). Until the font files arrive, Archivo stands in; swap the first name only. */
  --sans: "Breul Grotesk", "Breul Grotesk A", "Archivo", "Helvetica Neue", Arial, sans-serif;
  --mono: var(--sans);
  --m: 40px; --g: 20px; --head: 68px;
  color-scheme: only light;
  /* wide screens: everything sits in a centred column at most this wide */
  --maxw: 1440px; --pad: max(var(--m), calc((100vw - var(--maxw)) / 2));
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink); }
body { font: 400 16px/1.55 var(--sans); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
:focus-visible { outline: 2px solid var(--red); outline-offset: 3px; }
img { display: block; max-width: 100%; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.bar { position: sticky; top: 0; z-index: 20; height: var(--head); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  padding: 0 max(var(--m), env(safe-area-inset-right, 0px)) 0 max(var(--m), env(safe-area-inset-left, 0px)); background: var(--paper); }
.logo img { height: 22px; width: auto; }
.name { font-size: 13px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; }
.name b { font-weight: 800; }
.links { justify-self: end; display: flex; gap: 28px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
.links a:hover { color: var(--red); }
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--g); padding: 0 var(--m); }

/* ---------- home: two projects, one screen ---------- */
/* The home is exactly one screen: the Miata (greyed, not clickable) and the robots stand on one shared floor line,
   split by a hairline. Names show on hover only. The robots band opens below. */
#home { display: flex; flex-direction: column; }
#home[hidden], .case[hidden] { display: none; }
.sp { flex: 1 1 0; }
.herowrap { position: relative; flex: none; }
.hero { align-items: stretch; }
.more { position: absolute; left: 0; right: 0; top: calc(100% + 56px); margin: 0; text-align: center; font-size: 11px; font-weight: 700;
  letter-spacing: .16em; text-transform: uppercase; color: var(--mute); transition: opacity .25s ease; }
#home.open .more { opacity: 0; pointer-events: none; }
@media (min-width: 761px) {
  .bar { padding-left: var(--pad); padding-right: var(--pad); }
  .grid { padding-left: var(--pad); padding-right: var(--pad); }
  .band { padding-left: var(--pad) !important; padding-right: var(--pad) !important; }
  .herosec .scene { margin: 0 auto; }
  /* the robot, its name and the note sit centred in the screen under the header */
  .case:not([hidden]) { display: flex; flex-direction: column; min-height: calc(100svh - var(--head)); }
  .case .herosec { margin-top: auto; }
  .case .soon { margin-bottom: auto; padding-top: 40px; padding-bottom: 72px; }
  /* open: if the robots would come out too small, the two projects above shrink (scaled from the top) to make room */
  .herowrap { transform-origin: 50% 0; }
  #home.open .herowrap { transform: scale(var(--hs, 1)); margin-bottom: calc(var(--hd, 0) * -1px); }
  #home { height: calc(100svh - var(--head)); min-height: 560px; overflow: hidden; }
  #home.open .sp-top { flex: 0 0 20px; }
  .band { flex: none; height: calc(var(--bandH, 400) * 1px); display: flex; flex-direction: column; justify-content: center; padding-bottom: 36px; }
  .band[hidden] { display: none; }
  .band-foot { display: none; }
}
.tile { position: relative; display: flex; flex-direction: column; justify-content: flex-end; min-width: 0; }
.t-cap { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 20px; height: 44px;
  font-size: 12px; font-weight: 800; letter-spacing: .02em; text-transform: uppercase; }
.t-cap .nm { display: flex; align-items: center; gap: 8px; opacity: 0; transition: opacity .16s ease; white-space: nowrap; overflow: hidden; }
.t-cap .sub { color: var(--mute); }
.tile:hover .nm, .tile:focus-visible .nm { opacity: 1; }
.t-cap .lg { height: 14px; width: auto; flex: none; margin-right: 2px; }
.t-cap .lg-first { height: 16px; }
.t-cap .lg-miata { height: 14px; transform: translateY(-2.5px); }   /* the script hangs below its baseline; lift it to sit with the caps */
.t-miata { grid-column: 1 / span 7; cursor: default; }
.m-stage { position: relative; display: flex; justify-content: center; align-items: flex-end; flex: 1; }
.m-stage .car { position: relative; z-index: 1; width: calc(var(--cw, 600) * 1px); height: auto; max-width: none; flex: none; }
.wip { position: absolute; z-index: 0; left: 50%; transform: translateX(-50%); bottom: calc(var(--wb, 40) * 1px);
  font: 900 calc(var(--ws, 300) * 1px)/.74 var(--sans); font-stretch: 112%; letter-spacing: -.03em; color: #747570; white-space: nowrap; pointer-events: none; user-select: none; }
.t-robots { grid-column: 8 / span 5; cursor: pointer; }
.t-robots::before { content: ""; position: absolute; left: calc(var(--g) * -0.5 - 0.5px); top: 0; bottom: 44px; width: 1px; background: var(--line); }
.t-stage { display: flex; justify-content: center; align-items: flex-end; padding: 0 2%; }
.t-stage img { width: calc(var(--kt, .2) * var(--w) * 1px); height: auto; flex: none; max-width: none; transition: opacity .25s ease; }
.toggle { font: 300 22px/1 var(--sans); width: 22px; text-align: center; transition: transform .3s ease; display: inline-block; }
.t-robots[aria-expanded="true"] .toggle { transform: rotate(45deg); }
.t-robots[aria-expanded="true"] .t-stage img { opacity: .16; }

/* ---------- the band the robots tile opens: robots only, no text ---------- */
.band { overflow: hidden; padding: 0 var(--m); }
.row { display: flex; justify-content: center; align-items: flex-end; gap: var(--gap, 0px); padding-top: 12px; }
.bot { position: relative; display: flex; align-items: flex-end; flex: none; cursor: pointer; transition: opacity .16s ease; }
.bot img { width: calc(var(--k, .5) * var(--w) * 1px); height: auto; max-width: none; flex: none; }
.row.hovering .bot:not(:hover):not(:focus-visible) { opacity: .32; }
.cap { position: absolute; left: 50%; transform: translateX(-50%); top: calc(100% + 6px); white-space: nowrap; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; opacity: 0; transition: opacity .16s ease; }
.cap b { font-weight: 700; margin-right: .5em; }
.cap span { font-family: var(--mono); color: var(--mute); letter-spacing: 0; }
.bot:hover .cap, .bot:focus-visible .cap { opacity: 1; }
.band-foot { height: 64px; }
.mcap { display: none; }
.bcap { display: none; }
#home.snap .tile, #home.snap .row, #home.snap .bot, #home.snap .bot img { transition: none !important; }

/* ---------- robot page: the robot, its name standing beside it in the render's perspective, and one line ---------- */
.case { transition: opacity .22s ease; overflow-x: clip; }
.case.pre { opacity: 0; transition: none; }
.case > * { transition: opacity .32s ease; }
.case.entering > *:not(.herosec) { opacity: 0; transition: none; }
.crumbs { position: relative; z-index: 3; padding-top: 14px; display: flex; font-size: 20px; line-height: 1; }
.crumbs a { padding: 4px 8px 4px 0; }
.crumbs a:hover { color: var(--red); }
.scene { position: relative; margin: 0; }
.scene .heroimg { position: absolute; max-width: none; pointer-events: none; }
.world { position: absolute; inset: 0; transform-style: preserve-3d; pointer-events: none; }
.world svg { position: absolute; transform-origin: 0 0; overflow: visible; }
.world text { font-family: var(--sans); }
.world a { pointer-events: auto; cursor: pointer; }
.world a:hover .ext { stroke: var(--red); }
.ptext { transition: opacity .35s ease; }
.ptext.off { opacity: 0; transition: none; }
/* ---------- opening the site: the page fades in once, gently, all together ---------- */
html.intro .bar, html.intro #herowrap { opacity: 0; }
html.play .bar, html.play #herowrap { animation: in-soft .8s cubic-bezier(.2,.7,.2,1) both; }
@keyframes in-soft { from { opacity: 0; translate: 0 10px; } }
.soon { padding-top: 56px; padding-bottom: 120px; }
.soon p { grid-column: 1 / -1; margin: 0; text-align: center; font-size: 15px; font-weight: 800; letter-spacing: .01em; text-transform: uppercase; color: #7a7b76; }

canvas.seq { position: fixed; left: 0; top: 0; z-index: 30; pointer-events: none; will-change: transform; }
.tabbar { display: none; }

@media (max-width: 760px) {
  :root { --m: 16px; --g: 12px; --head: 56px; }
  .bar { grid-template-columns: auto 1fr; }
  .logo img { height: 18px; }
  .name { justify-self: end; font-size: 12px; }
  .links { display: none; }
  .tabbar { display: flex; position: fixed; z-index: 20; left: 0; right: 0; bottom: 0; justify-content: space-around; background: var(--paper);
    padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    font-size: 12px; letter-spacing: .06em; text-transform: uppercase; border-top: 1px solid var(--line); }
  .grid { grid-template-columns: minmax(0, 1fr); }
  .grid > * { grid-column: 1 / -1 !important; }
  .hero { row-gap: 28px; padding-top: 52px; }
  .sp { display: none; }
  .herowrap { padding-bottom: 72px; }
  .more { position: static; padding-top: 44px; }
  #home.open .more { display: none; }
  #home.open .herowrap { padding-bottom: 6px; }
  #home.open .t-robots .t-stage { display: none; }
  /* open on a phone: the caption stays under the robots (the band's own copy of it) instead of jumping above them */
  #home.open .t-robots .t-cap { display: none; }
  .t-robots[aria-expanded="true"] { padding-top: 18px; }
  .bcap { display: flex; width: 100%; padding: 16px 0 0; height: 40px; background: none; border: 0; color: inherit; font-family: inherit; text-align: left; cursor: pointer; }
  .bcap .nm { opacity: 1; }
  .bcap .toggle { transform: rotate(45deg); }
  .mcap { padding-top: 6px !important; }
  .row { padding-top: 0; }
  .t-robots::before { display: none; }
  .t-robots { border-top: 1px solid var(--line); padding-top: 24px; }
  .t-cap .nm { opacity: 1; }
  .row { overflow-x: auto; overflow-y: hidden; justify-content: flex-start; gap: 0; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain;
    margin: 0 calc(-1 * var(--m)); }
  .row::-webkit-scrollbar { display: none; }
  .row .slide { scroll-snap-stop: always; flex: 0 0 54vw; display: flex; justify-content: center; align-items: flex-end; scroll-snap-align: center; }
  .row { transition: height .3s ease; }
  .row .slide:first-child { margin-left: 23vw; } .row .slide:last-child { margin-right: 23vw; }
  .row .slide:not(.on) .bot { opacity: .5; }
  .row.hovering .bot:not(:hover) { opacity: 1; }
  .row .cap { display: none; }
  .mcap { display: flex; justify-content: space-between; align-items: baseline; padding-top: 12px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
  .mcap b { margin-right: .5em; }
  .mcap .yr { font-family: var(--mono); color: var(--mute); letter-spacing: 0; }
  .dots { display: flex; gap: 6px; }
  .dots i { width: 14px; height: 2px; background: var(--line); }
  .dots i.on { background: var(--ink); }
  .band-foot { height: calc(72px + env(safe-area-inset-bottom, 0px)); }   /* clears the bottom link bar */
  /* until the write-up arrives, the robot, its name and the note sit centred in the space between the bars */
  .case:not([hidden]) { display: flex; flex-direction: column; min-height: calc(100svh - var(--head)); padding-bottom: calc(46px + env(safe-area-inset-bottom, 0px)); }
  .case .herosec { margin-top: auto; }
  .case .soon { margin-bottom: auto; padding-top: 28px; padding-bottom: 44px; }
  .soon p { font-size: 13px; }
}
@media (prefers-reduced-motion: reduce) { .bot, .cap, .case, .toggle, .t-stage img, .t-cap .nm, .ptext { transition: none !important; } }
</style>
</head>
<body>
<header class="bar">
  <a class="logo" href="#home" data-go="home" aria-label="Home"><img src="img/logo-ink.svg" alt="JT"></a>
  <div class="name"><b>Jarrett</b> Hutto</div>
  <nav class="links" aria-label="Links"><a href="#home" data-go="home">Resume</a><a href="mailto:jarrett@jthutto.com">Contact</a><a href="https://www.linkedin.com/in/hutto" target="_blank" rel="noopener">LinkedIn</a></nav>
</header>

<main id="home">
  <div class="sp sp-top"></div>
  <div class="herowrap" id="herowrap">
  <div class="hero grid">
    <div class="tile t-miata" aria-label="Miata, coming soon">
      <div class="m-stage" id="mstage"><span class="wip" aria-hidden="true">WIP</span><img class="car" id="car" src="img/miata-side.webp" alt="Mazda Miata NA, grey clay model"></div>
      <span class="t-cap"><span class="nm"><img class="lg lg-miata" src="brand/miata.svg" alt="Miata"><span class="sub">Coming soon</span></span></span>
    </div>
    <button type="button" class="tile t-robots" id="robotsTile" aria-expanded="false" aria-controls="band" aria-label="FIRST Robotics, FRC 4639 robots">
      <span class="t-stage" id="tstage"></span>
      <span class="t-cap"><span class="nm"><img class="lg lg-first" src="brand/first.webp" alt="FIRST"><span>Robotics</span></span><span class="toggle" aria-hidden="true">+</span></span>
    </button>
  </div>
  <p class="more">More coming soon</p>
  </div>
  <section class="band" id="band" aria-label="FRC 4639 robots" hidden>
    <div class="row" id="row"></div>
    <button type="button" class="t-cap bcap" id="bcap" aria-label="Close FIRST Robotics"><span class="nm"><img class="lg lg-first" src="brand/first.webp" alt="FIRST"><span>Robotics</span></span><span class="toggle" aria-hidden="true">+</span></button>
    <div class="mcap" id="mcap"><span><b id="mname"></b><span class="yr" id="myear"></span></span><span class="dots" id="dots"></span></div>
    <div class="band-foot"></div>
  </section>
  <div class="sp sp-bot"></div>
</main>

<main id="case" class="case" hidden></main>
<nav class="tabbar" aria-label="Links"><a href="#home" data-go="home">Resume</a><a href="mailto:jarrett@jthutto.com">Contact</a><a href="https://www.linkedin.com/in/hutto" target="_blank" rel="noopener">LinkedIn</a></nav>

<script src="turn/meta-v13.js"></script>
<script>
(() => {
  /* META (from the render prep): one crop box shared by every frame of every robot, so scale and floor line up.
     box: [x0, y0, w, h] in render px; out: file px per render px; per robot: n frames, trim (empty share left/right of frame 0),
     trimQ/topQ (same for the last frame), dims (bumper width, depth in m). Camera B: 85 mm on a 36 mm sensor at 2000 px,
     eye 0.45 m, 4.5 m from the axis, horizon row 1300. */
  const M = window.META;
  const R = {
    /* link: the team's page for that robot (placeholder until Jarrett sends the real ones) */
    '2026': { name: 'Netherite', lines: ['NETHERITE'], link: 'https://www.thebluealliance.com/team/4639/2026' },
    '2025': { name: 'Heart of the Sea', lines: ['HEART OF', 'THE SEA'], em: 0.25, link: 'https://www.thebluealliance.com/team/4639/2025' },
    '2024': { name: 'Cadenza', lines: ['CADENZA'], em: 0.18, link: 'https://www.thebluealliance.com/team/4639/2024' },
  };
  const ORDER = ['2024', '2025', '2026'].filter(y => M.r[y]);   /* oldest on the left, newest on the right, next to the tile */
  const TILE = ORDER[ORDER.length - 1], TI = ORDER.length - 1;   /* the tile shows the newest robot; it flies out to its spot in the band */
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const phone = () => innerWidth <= 760;
  const $ = (s, el = document) => el.querySelector(s);
  const home = $('#home'), cs = $('#case'), row = $('#row'), band = $('#band'), tile = $('#robotsTile');
  let current = 'home', busy = false, open = false;
  const pad = i => String(i).padStart(3, '0');
  const BW = Math.round(M.box[2] * M.out), BH = Math.round(M.box[3] * M.out);   /* frame size in file px */
  /* Three frame sizes: 800 px for phones and the board's shrunken previews, 1200 px for ordinary
     desktop screens, the full 1606 px only for big retina screens. Each is as sharp as the screen can show and no bigger. ?k= is the scale the board draws this page at. */
  const KS = +(new URLSearchParams(location.search).get('k')) || 1;
  const NEED = Math.min(innerWidth, 1440) * 0.7 * (devicePixelRatio || 1) * KS;   /* about how many screen pixels wide the robot gets */
  const TIER = NEED <= 900 ? ['v13s', 800] : NEED <= 1300 ? ['v13m', 1200] : ['v13', BW];
  const SMALL = TIER[1] <= 800, SW = TIER[1];
  const src = (y, i) => `turn/${TIER[0]}/${y}/${pad(i)}.webp`;   /* new folder per frame update, so no browser mixes in cached old frames */
  const last = y => M.r[y].n - 1;
  const tightW = y => BW * (1 - M.r[y].trim[0] - M.r[y].trim[1]);
  const imgTag = (y, kvar) => { const t = M.r[y].trim;
    return `<img src="${src(y, 0)}" style="--w:${BW};margin-left:calc(var(${kvar}) * ${(-t[0] * BW).toFixed(1)}px);margin-right:calc(var(${kvar}) * ${(-t[1] * BW).toFixed(1)}px)" width="${BW}" height="${BH}" alt="${R[y].name}, ${y} robot, front view">`; };
  const head = () => parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--head')) || 68;

  $('#dots').innerHTML = ORDER.map(() => '<i></i>').join('');
  $('#tstage').innerHTML = imgTag(TILE, '--kt').replace('style="', `style="margin-top:calc(var(--kt) * ${(-(M.r[TILE].topQ - 0.03) * BH).toFixed(1)}px);`);
  row.innerHTML = ORDER.map((y, i) => `<div class="slide" data-i="${i}"><a class="bot" href="#r${y}" data-y="${y}" aria-label="${R[y].name}, ${y}">${imgTag(y, '--k')}<span class="cap"><b>${R[y].name}</b><span>${y}</span></span></a></div>`).join('');

  const sumW = () => ORDER.reduce((s, y) => s + tightW(y), 0);
  /* the Miata render: its crop and where its tyres meet the floor (fraction of image height from the bottom) */
  const CARS = { side: 0.0281, q12: 0.0292, q25: 0.035 };   /* three angles rendered; straight side view is his pick (?car=q12|q25 still compares) */
  const carPick = new URLSearchParams(location.search).get('car'), CAR = { floor: CARS[carPick] || CARS.side };
  $('#car').src = `img/miata-${CARS[carPick] ? carPick : 'side'}.webp`;
  let HS = 1;
  function fit() {
    const root = document.documentElement.style;
    const avail = innerHeight - head() - (phone() ? 50 : 0);
    const tw = $('#tstage').clientWidth || tile.clientWidth;
    const y0 = TILE, visH = (1 - M.r[y0].topQ + 0.03) * BH;
    const kt = Math.min((tw * (phone() ? 0.62 : 0.8)) / tightW(y0), (avail * (phone() ? 0.3 : 0.56)) / visH);
    root.setProperty('--kt', kt.toFixed(4));
    const car = $('#car'), cellW = $('#mstage').clientWidth;
    if (car && car.naturalWidth) {
      const ar = car.naturalWidth / car.naturalHeight, robotH = kt * visH;
      const cw = Math.min(cellW * 0.86, robotH * (phone() ? 0.9 : 0.78) * ar);   /* the car sits a bit lower than the robot, like in his mockup */
      root.setProperty('--cw', cw.toFixed(1));
      root.setProperty('--ws', (cw * 0.5).toFixed(1));
      /* stand the car on the same floor line as the robot (its frame has ~11% of floor under the bumpers) */
      const carFloor = cw / ar * CAR.floor, botFloor = kt * BH * 0.108;
      $('#mstage').style.paddingBottom = Math.max(0, botFloor - carFloor).toFixed(1) + 'px';
      root.setProperty('--wb', (Math.max(carFloor, botFloor)).toFixed(1));
      /* room above the car for the top of the WIP letters, so they never run into the header */
      const wipTop = Math.max(carFloor, botFloor) + cw * 0.5 * 0.74, carTop = Math.max(0, botFloor - carFloor) + cw / ar;
      $('#mstage').style.paddingTop = Math.max(0, wipTop - carTop + 6).toFixed(1) + 'px';
    }
    const W = band.clientWidth || (innerWidth - 2 * (phone() ? 16 : 40));
    let k;
    if (phone()) { const tq = Math.min(...ORDER.map(y => M.r[y].topQ)); k = Math.min((innerHeight * 0.34) / (BH * (1 - tq + 0.04)), (innerWidth * 0.54) / Math.max(...ORDER.map(tightW))); }
    else {

    const SS = soft ? 1.5 : Math.min(4, Math.max(2, Math.ceil(3 / (devicePixelRatio || 1)) + 1)), sx = ux.map(v => v / SS), sy = uy.map(v => v / SS);
    Object.assign(el.style, { left: ox + 'px', top: oy + 'px', width: pl.w * k * SS + 'px', height: pl.h * k * SS + 'px',
      transform: `matrix3d(${sx.join(',')},0,${sy.join(',')},0,${nrm.join(',')},0,${t.join(',')},1)` });
  }

  function caseHTML(y) {
    return `
    <div class="grid"><div class="crumbs" style="grid-column:1/-1"><a href="#home" data-go="home" aria-label="Back to all work">&larr;</a></div></div>
    <h1 class="sr">${R[y].name}, ${y}</h1>
    <section class="grid herosec"><div style="grid-column:1/-1">${sceneHTML(y)}</div></section>
    <section class="soon grid"><p>More information coming soon</p></section>`;
  }

  /* ---------- the rotation: rendered frames played while the robot travels ---------- */
  const cache = {};
  /* Frames download early but are only unpacked (decoded) for the robot you're about to open, and at most two robots are
     kept unpacked; the rest are freed. Unpacking all 144 full-size frames at once (over a gigabyte) is what froze phones.
     The turn never waits more than ~0.4 s: whatever is unpacked by then plays, and a missing frame borrows its neighbour. */
  const wait = ms => new Promise(r => setTimeout(r, ms));
  let lru = [];
  function prime(y) {
    if (!cache[y]) cache[y] = { els: [...Array(M.r[y].n)].map((_, i) => { const im = new Image(); im.decoding = 'async'; im.src = src(y, i); return im; }), arr: [], all: null };
    return cache[y];
  }
  function frames(y) {
    const f = prime(y);
    lru = [y, ...lru.filter(v => v !== y)];
    const KEEP = SW < BW ? 2 : 1;   /* full-size frames are ~8 MB each unpacked, so a big retina screen keeps just one robot ready */
    lru.slice(KEEP).forEach(o => { const g = cache[o]; if (g && g.all) { g.arr.forEach(b => b && b.close && b.close()); g.arr = []; g.all = null; } });
    lru = lru.slice(0, KEEP);
    if (!f.all) { const arr = f.arr = new Array(f.els.length);
      /* unpack in playing order, three at a time, so the first frames are ready first and a turn that starts early
         isn't fighting 48 decodes at once; each one ends GPU-ready, so drawing a turn frame is a cheap copy */
      let next = 0;
      const worker = async () => { while (next < arr.length && f.arr === arr) { const i = next++, im = f.els[i];
        try { await im.decode(); const b = window.createImageBitmap ? await createImageBitmap(im).catch(() => im) : im;
          if (f.arr === arr) arr[i] = b; else if (b.close) b.close(); } catch (e) {} } };
      f.all = Promise.all([worker(), worker(), worker()]); }
    const arr = f.arr;
    return Promise.race([f.all, wait(400)]).then(() => arr);
  }
  let seqYear = null;
  function playSeq(imgs, fromRect, toRect, forward) { return playV2(imgs, fromRect, toRect, forward, !!(M.r[seqYear] && M.r[seqYear].baked)); }
  /* One rendered frame per screen frame, no browser blur. The travel eases gently and keeps a little speed at both ends,
     so the robot never creeps by fractions of a pixel (that read as jitter). The turn has its own stronger curve: slow out
     of head-on, quick through the middle, slow into the three-quarter view. The 48-frame renders bake smootherstep into
     their spacing, so the frame index is mapped back through it. */
  const smoother = t => t * t * t * (t * (6 * t - 15) + 10);
  const CURVE = t => 0.15 * t + 0.85 * smoother(t);                      /* the travel */
  const SPIN = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;   /* the turn: slower start and finish, about 3x speed mid-way */
  const unSmoother = y => { let lo = 0, hi = 1; for (let k = 0; k < 24; k++) { const m = (lo + hi) / 2; if (smoother(m) < y) lo = m; else hi = m; } return (lo + hi) / 2; };
  const TURN_MS = 1000;
  function playV2(imgs, fromRect, toRect, forward, baked) {
    return new Promise(done => {
      const c = document.createElement('canvas'); c.className = 'seq';
      const dpr = Math.min(3, devicePixelRatio || 1), big = fromRect.width > toRect.width ? fromRect : toRect;   /* full phone sharpness, so nothing pops when the real image takes over */
      const cw = Math.min(Math.round(big.width * dpr), SW);                 /* never larger than the frames themselves */
      c.width = cw; c.height = Math.round(cw * BH / BW);
      const ctx = c.getContext('2d'); ctx.imageSmoothingQuality = 'high'; document.body.append(c);
      const n = imgs.length;
      const a = [fromRect.left + fromRect.width / 2, fromRect.top + fromRect.height / 2], b = [toRect.left + toRect.width / 2, toRect.top + toRect.height / 2];
      let last = null, el = 0, prev = null;
      const pick = i => { for (let d = 0; d < n; d++) { if (imgs[i - d]) return imgs[i - d]; if (imgs[i + d]) return imgs[i + d]; } return null; };
      const place = t => {
        const p = CURVE(t), r = SPIN(t);
        const w = fromRect.width + (toRect.width - fromRect.width) * p, h = fromRect.height + (toRect.height - fromRect.height) * p;
        const cx = a[0] + (b[0] - a[0]) * p, cy = a[1] + (b[1] - a[1]) * p;
        /* snap every edge to the screen's pixel grid, the way Chrome places the real images (exact match on desktop), so the hand-overs line up exactly */
        const dp = devicePixelRatio || 1, sn = v => Math.floor(v * dp) / dp;
        const L = sn(cx - w / 2), T = sn(cy - h / 2), W = sn(cx + w / 2) - L, H = sn(cy + h / 2) - T;
        c.style.transform = `translate(${L}px, ${T}px)`; c.style.width = W + 'px'; c.style.height = H + 'px';
        const q = baked ? unSmoother(r) : r;
        const i = Math.round((forward ? q : 1 - q) * (n - 1));
        const im = pick(i);
        if (im && im !== last) { try { ctx.clearRect(0, 0, c.width, c.height); ctx.drawImage(im, 0, 0, c.width, c.height); last = im; } catch (e) {} }
      };
      /* the clock only runs once the page swap has painted, and a slow frame advances it by at most 1/30 s,
         so a hiccup slows the robot for a moment instead of making it jump */
      const step = now => {
        if (prev !== null) el += Math.min(50, now - prev);
        prev = now;
        const t = Math.min(1, el / TURN_MS);
        place(t);
        if (t < 1) requestAnimationFrame(step); else done(c);
      };
      place(0);
      requestAnimationFrame(() => requestAnimationFrame(step));
    });
  }
  /* swap the canvas for the real image without a gap: show the image under the canvas, then drop the canvas a frame later */
  /* a stand-in copy of the image, pinned where it is, so the robot never vanishes while the page swaps underneath it */
  const holdAt = (img, r) => { const h = img.cloneNode(); h.removeAttribute('id');
    Object.assign(h.style, { position: 'fixed', left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px', margin: 0,
      maxWidth: 'none', zIndex: 29, pointerEvents: 'none', visibility: 'visible', transform: 'none', opacity: 1 }); document.body.append(h); return h; };
  /* the real image appears under the last canvas frame, and the canvas fades off it over 0.18 s, so any tiny difference in
     how the browser scales the two dissolves instead of flashing */
  const handOff = (c, img) => new Promise(r => { img.style.visibility = '';
    requestAnimationFrame(() => { const an = c.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 180, easing: 'ease-out', fill: 'forwards' });
      const end = () => { c.remove(); r(); }; an.onfinish = end; an.oncancel = end; }); });

  async function openCase(y, srcImg) {
    if (busy || current === y) return; busy = true;
    if (!popping) hist('push', { r: y, own: true }, '#r' + y);
    try {
    const seqP = frames(y);
    const fromRect = srcImg ? srcImg.getBoundingClientRect() : null;
    const visible = fromRect && fromRect.bottom > 0 && fromRect.top < innerHeight && fromRect.width > 0;
    let hold = null;
    if (visible && !reduce) {
      hold = holdAt(srcImg, fromRect); srcImg.style.visibility = 'hidden';
      const fade = current === 'home' ? [...home.querySelectorAll('.tile, .mcap, #row .bot')] : [...cs.children];
      fade.forEach(el => { if (!el.contains(srcImg)) el.animate([{ opacity: getComputedStyle(el).opacity }, { opacity: 0 }], { duration: 180, fill: 'forwards' }); });
      await Promise.all([seqP, new Promise(r => setTimeout(r, 160))]);
    }
    cs.innerHTML = caseHTML(y); cs.classList.add('pre');
    home.hidden = true; cs.hidden = false; scrollTo(0, 0); current = y; layoutScene();
    const hero = $('#heroImg'), pt = $('#ptext');
    await (hero.decode ? hero.decode().catch(() => {}) : 0);
    if (visible && !reduce) {
      hero.style.visibility = 'hidden'; cs.classList.add('entering'); cs.classList.remove('pre');
      seqYear = y;
      const imgs = await seqP; imgs[0] = imgs[0] || srcImg; imgs[imgs.length - 1] = imgs[imgs.length - 1] || hero;
      const pr = playSeq(imgs, fromRect, hero.getBoundingClientRect(), true);
      if (hold) hold.remove();                         /* the canvas has already drawn its first frame */
      const c = await pr;
      await handOff(c, hero);
      cs.classList.remove('entering');                 /* only the text and pictures fade in; the robot never blinks */
    }
    cs.classList.remove('pre');
    requestAnimationFrame(() => pt.classList.remove('off'));
    if (hold) hold.remove();
    if (srcImg) srcImg.style.visibility = '';
    home.getAnimations({ subtree: true }).forEach(a => a.cancel());
    } finally { busy = false; if (backLater) { backLater = false; setTimeout(back, 0); } }
  }

  async function goHome() {
    if (busy || current === 'home') return; busy = true;
    try {
    const y = current, hero = $('#heroImg'), seqP = frames(y);
    const fromRect = hero ? hero.getBoundingClientRect() : null;
    const visible = fromRect && fromRect.bottom > 0 && fromRect.top < innerHeight;
    let hold = null;
    if (visible && !reduce) {
      hold = holdAt(hero, fromRect);
      [...cs.children].filter(el => !el.classList.contains('herosec')).forEach(el => el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 160, fill: 'forwards' }));
      $('#ptext').classList.add('off');
      await Promise.all([seqP, new Promise(r => setTimeout(r, 150))]);
    }
    cs.hidden = true; home.hidden = false; current = 'home';
    if (!open) await setBand(true, { instant: true });
    fit();
    scrollTo(0, Math.max(0, band.getBoundingClientRect().top + scrollY - head() - 16));
    const i = ORDER.indexOf(y); if (phone()) centre(i, false);
    const target = row.querySelector(`.bot[data-y="${y}"] img`);
    if (visible && !reduce) {
      target.style.visibility = 'hidden';
      [...home.querySelectorAll('.tile, .mcap, #row .bot')].filter(el => !el.contains(target))
        .forEach(el => el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 260, delay: 560, fill: 'backwards' }));
      seqYear = y;
      const imgs = await seqP; imgs[0] = imgs[0] || target; imgs[imgs.length - 1] = imgs[imgs.length - 1] || hero;
      const pr = playSeq(imgs, fromRect, target.getBoundingClientRect(), false);
      if (hold) hold.remove();
      const c = await pr;
      await handOff(c, target);
    }
    if (hold) hold.remove();
    cs.innerHTML = '';
    } finally { busy = false; }
  }

  let popping = false;
  const hist = (k, st, url) => { try { k === 'push' ? history.pushState(st, '', url) : history.replaceState(st, '', url); } catch (e) {} };
  /* in-page back: step the browser history when we added the entry, so the phone back gesture and this link agree */
  let backLater = false;
  function back() {
    if (busy && current !== 'home') { backLater = true; return; }   /* tapped mid-turn: go back as soon as it lands */
    if (busy || current === 'home') return;
    hist('push', { home: true, own: true }, location.pathname + location.search);
    goHome();
  }
  addEventListener('popstate', async e => {
    const r = e.state && e.state.r;
    while (busy) await new Promise(res => setTimeout(res, 50));
    popping = true;
    try { if (r && M.r[r]) { if (current !== r) await go(r); } else if (current !== 'home') await goHome(); }
    finally { popping = false; }
  });
  function go(where, srcImg) {
    if (where === 'home') return goHome();
    if (current === 'home' && !srcImg) {
      if (!open) setBand(true, { instant: true });
      scrollTo(0, Math.max(0, band.getBoundingClientRect().top + scrollY - head() - 16));
      if (phone()) centre(ORDER.indexOf(where), false);
      srcImg = row.querySelector(`.bot[data-y="${where}"] img`);
    }
    return openCase(where, srcImg);
  }

  document.addEventListener('click', e => {
    const g = e.target.closest('[data-go]');
    if (g) { e.preventDefault(); back(); return; }
    const b = e.target.closest('.bot'); if (!b) return;
    e.preventDefault();
    if (phone() && b.closest('#row')) { const i = +b.closest('.slide').dataset.i; if (i !== active) { centre(i, true); return; } }
    go(b.dataset.y, b.querySelector('img'));
  });
  row.addEventListener('pointerover', e => { const b = e.target.closest('.bot'); if (b) frames(b.dataset.y); });
  tile.addEventListener('pointerenter', () => frames(TILE));
  setTimeout(() => [...ORDER].reverse().forEach(prime), 300);   /* download the turns early (newest first); unpack only on demand */

  addEventListener('resize', fit);
  $('#car').addEventListener('load', fit);
  if (document.fonts) document.fonts.ready.then(() => current !== 'home' && layoutScene());
  fit();
  addEventListener('message', e => { const d = e.data; if (!d) return;
    if (d.jtgo === 'home') { if (current !== 'home') goHome(); else setBand(false); }
    else if (d.jtgo === 'band') { if (current !== 'home') goHome(); else setBand(true); }
    else if (d.jtgo && M.r[d.jtgo]) go(d.jtgo);
  });
  /* the entrance waits for the two pictures so nothing pops in halfway (gives up after three seconds) */
  if (document.documentElement.classList.contains('intro')) {
    const pics = [$('#car'), $('#tstage img')].filter(Boolean).map(im => im.decode ? im.decode().catch(() => {}) : 0);
    Promise.race([Promise.all(pics), wait(3000)]).then(() => { fit(); const de = document.documentElement; de.classList.add('play'); de.classList.remove('intro'); setTimeout(() => de.classList.remove('play'), 1000); });
  }
  const h = location.hash.replace('#r', '');
  if (R[h] && M.r[h]) { hist('replace', { r: h }, location.href); home.hidden = true; cs.hidden = false; current = h;
    cs.innerHTML = caseHTML(h); layoutScene(); $('#ptext').classList.remove('off'); }
  else if (location.hash === '#band') setBand(true, { instant: true });
})();
</script>
</body>
</html>
