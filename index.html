<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JT Hutto</title>
<meta name="description" content="JT Hutto. jarrett@jthutto.com">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* --w is the logo width; everything scales from it. */
  :root { --w: max(200px, 18.2vw); --red: #de2910; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #fff; color: #000; overflow: hidden;
    font-family: "Atkinson Hyperlegible", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* The piece is drawn five times, stacked: the sharp copy on top, then four copies with
     increasing blur. Each copy has a white background and a mask that fades it out toward
     the rim, so the center is perfectly crisp and the edges melt off in smooth steps,
     text included, with no ghosting. */
  .stack { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
  .card {
    width: var(--w); padding: calc(var(--w) * .14) calc(var(--w) * .24);
    background: #fff; font-size: calc(var(--w) * 0.038); line-height: 1; text-transform: uppercase;
  }
  .card:not(.b4) { position: absolute; inset: 0; box-sizing: content-box; }
  .sharp { --a: 48%; --b: 64%; }
  .b1 { --a: 64%; --b: 76%; filter: blur(calc(var(--w) * .0011)); }
  .b2 { --a: 76%; --b: 87%; filter: blur(calc(var(--w) * .0022)); }
  .b3 { --a: 87%; --b: 98%; filter: blur(calc(var(--w) * .0036)); }
  .b4 { filter: blur(calc(var(--w) * .0054)); }
  .card:not(.b4) {
    -webkit-mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 var(--a), transparent var(--b));
            mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 var(--a), transparent var(--b));
  }
  .b4, .b3, .b2, .b1 { pointer-events: none; user-select: none; }

  .mark { position: relative; width: 100%; aspect-ratio: 900 / 332; }
  .mark svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .links { display: flex; justify-content: space-between; margin-top: calc(var(--w) * 0.03); white-space: nowrap; }
  a { color: inherit; text-decoration: none; }
  a:hover { color: var(--red); }
  a:focus-visible { outline: 1px solid var(--red); outline-offset: 2px; }
  b { font-weight: 700; }

  /* Hover: every copy in the stack changes color together, so the blurred rim follows. */
  .stack:has(.sharp .links a:first-child:hover) .links a:first-child,
  .stack:has(.sharp .links a:last-child:hover) .links a:last-child { color: var(--red); }

  /* Intro, a camera "focus pull": the piece arrives out of focus, the lens racks in,
     overshoots a hair and settles, while the crisp zone opens out from the center.
     Then the signature is written across the frame and the contact line racks in. */
  @property --a { syntax: '<percentage>'; inherits: false; initial-value: 0%; }
  @property --b { syntax: '<percentage>'; inherits: false; initial-value: 0%; }
  .stack { animation: pull 1.9s cubic-bezier(.22, .61, .36, 1) .15s both; }
  .sharp { animation: open 1.6s cubic-bezier(.65, 0, .35, 1) .35s both; }
  .sig { animation: sign .95s cubic-bezier(.7, 0, .3, 1) 1.45s both; }
  .links { animation: rack 1s cubic-bezier(.22, .61, .36, 1) 1.95s both; }
  @keyframes pull {
    0%   { opacity: 0; filter: blur(calc(var(--w) * .06)); scale: 1.045; }
    25%  { opacity: 1; }
    62%  { filter: blur(0); scale: 1; }
    78%  { filter: blur(calc(var(--w) * .006)); }
    100% { opacity: 1; filter: blur(0); scale: 1; }
  }
  @keyframes open { from { --a: 0%; --b: 6%; } to { --a: 48%; --b: 64%; } }
  @keyframes sign { from { clip-path: inset(-20% 100% -20% 0); } to { clip-path: inset(-20% -20% -20% 0); } }
  @keyframes rack {
    from { opacity: 0; filter: blur(calc(var(--w) * .012)); letter-spacing: .12em; }
    to   { opacity: 1; filter: blur(0); letter-spacing: 0; }
  }
  @media (prefers-reduced-motion: reduce) { .stack, .sharp, .sig, .links { animation: none; } }

  /* Phones: the whole piece turns sideways and runs down the screen. */
  @media (orientation: portrait) and (max-width: 760px) {
    :root { --w: min(55svh, 150vw); }
    .stack { transform: translate(-50%, -50%) rotate(90deg); }
  }
</style>
</head>
