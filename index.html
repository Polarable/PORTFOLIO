<style>
/* Layout (round 3, camera B): the page is the floor. No rules; every robot is rendered by one shared camera
   (85 mm, 4.5 m, eye 45 cm) with its real shadow, so they share a scale and a horizon. The robots are ONE compact tile
   that opens a full-width band under its row. Single light look on purpose: this mocks the site itself. */
:root {
  --paper: #f0f0ec; --ink: #151514; --mute: #84857f; --line: #cfd0c9; --ghost: #e4e4df; --red: #de2910;
  /* Breul Grotesk everywhere (his pick). Until the font files arrive, Archivo stands in; swap the first name only. */
  --sans: "Breul Grotesk", "Breul Grotesk A", "Archivo", "Helvetica Neue", Arial, sans-serif;
  --mono: var(--sans);
  --m: 40px; --g: 20px; --head: 68px;
  color-scheme: only light;
  /* wide screens: everything sits in a centred column at most this wide */
  --maxw: 1440px; --pad: max(var(--m), calc((100vw - var(--maxw)) / 2));
}
* { box-sizing: border-box; }
html { background: var(--paper); }
html, body { margin: 0; color: var(--ink); }
body { font: 400 16px/1.55 var(--sans); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
:focus-visible { outline: 2px solid var(--red); outline-offset: 3px; }
img { display: block; max-width: 100%; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.bar { position: sticky; top: 0; z-index: 20; height: var(--head); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  padding: 0 max(var(--m), env(safe-area-inset-right, 0px)) 0 max(var(--m), env(safe-area-inset-left, 0px)); transition: background-color .4s ease; }
html.scrolled .bar, .tabbar { background: rgba(240, 240, 236, .66); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); }
.logo img { height: 22px; width: auto; }
.name { font-size: 13px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; }
.name b { font-weight: 800; }
.links { justify-self: end; display: flex; gap: 28px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
.links a:hover { color: var(--red); }
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--g); padding: 0 var(--m); }

/* ---------- home: two projects, one screen ---------- */
/* The home is exactly one screen: the Miata (greyed, not clickable) and the robots stand on one shared floor line,
   split by a hairline. Names show on hover only. The robots band opens below. */
#home { display: flex; flex-direction: column; }
#home[hidden], .case[hidden] { display: none; }
.sp { flex: 1 1 0; }
.herowrap { position: relative; flex: none; }
.hero { align-items: stretch; }
.more { position: absolute; left: 0; right: 0; top: calc(100% + 56px); margin: 0; text-align: center; font-size: 11px; font-weight: 700;
  letter-spacing: .16em; text-transform: uppercase; color: var(--mute); transition: opacity .25s ease; }
#home.open .more { opacity: 0; pointer-events: none; }
@media (min-width: 761px) {
  .bar { padding-left: var(--pad); padding-right: var(--pad); }
  .grid { padding-left: var(--pad); padding-right: var(--pad); }
  .band { padding-left: var(--pad) !important; padding-right: var(--pad) !important; }
  .herosec .scene { margin: 0 auto; }
  /* the robot, its name and the note sit centred in the screen under the header */
  .case:not([hidden]) { display: flex; flex-direction: column; min-height: calc(100svh - var(--head)); }
  .case .herosec { margin-top: auto; }
  .case .soon { margin-bottom: auto; padding-top: 40px; padding-bottom: 72px; }
  /* open: if the robots would come out too small, the two projects above shrink (scaled from the top) to make room */
  .herowrap { transform-origin: 50% 0; }
  #home.open .herowrap { transform: scale(var(--hs, 1)); margin-bottom: calc(var(--hd, 0) * -1px); }
  #home { height: calc(100svh - var(--head)); min-height: 560px; overflow: hidden; }
  #home.open .sp-top { flex: 0 0 20px; }
  .band { flex: none; height: calc(var(--bandH, 400) * 1px); display: flex; flex-direction: column; justify-content: center; padding-bottom: 36px; }
  .band[hidden] { display: none; }
  .band-foot { display: none; }
}
.tile { position: relative; display: flex; flex-direction: column; justify-content: flex-end; min-width: 0; }
.t-cap { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 20px; height: 44px;
  font-size: 12px; font-weight: 800; letter-spacing: .02em; text-transform: uppercase; }
.t-cap .nm { display: flex; align-items: center; gap: 8px; opacity: 0; transition: opacity .16s ease; white-space: nowrap; overflow: hidden; }
.t-cap .sub { color: var(--mute); }
.tile:hover .nm, .tile:focus-visible .nm { opacity: 1; }
.t-cap .lg { height: 14px; width: auto; flex: none; margin-right: 2px; }
.t-cap .lg-first { height: 16px; }
.t-cap .lg-miata { height: 14px; transform: translateY(-2.5px); }   /* the script hangs below its baseline; lift it to sit with the caps */
.t-miata { grid-column: 1 / span 7; cursor: default; }
.m-stage { position: relative; display: flex; justify-content: center; align-items: flex-end; flex: 1; }
.m-stage .car { position: relative; z-index: 1; width: calc(var(--cw, 600) * 1px); height: auto; max-width: none; flex: none; transform: scaleX(-1); }   /* mirrored: the car faces right, so it can drive in from the left edge */
.m-stage.wip-wait .wip { opacity: 0; }   /* WIP stays dark while the car drives in, then flashes on as it stops */
.m-stage.wip-flash .wip { animation: wip-flash .5s linear both; }
@keyframes wip-flash { 0% { opacity: 0; } 10% { opacity: 1; } 22% { opacity: .1; } 36% { opacity: 1; } 48% { opacity: .45; } 62%, 100% { opacity: 1; } }
.m-stage .drive { position: absolute; z-index: 1; max-width: none; pointer-events: none; will-change: transform; }   /* the drive-in frames, laid exactly over the car */
.wip { position: absolute; z-index: 0; left: 50%; transform: translateX(-50%); bottom: calc(var(--wb, 40) * 1px);
  font: 900 calc(var(--ws, 300) * 1px)/.74 var(--sans); font-stretch: 112%; letter-spacing: -.03em; color: #747570; white-space: nowrap; pointer-events: none; user-select: none; }
.t-robots { grid-column: 8 / span 5; cursor: pointer; }
.t-robots::before { content: ""; position: absolute; left: calc(var(--g) * -0.5 - 0.5px); top: 0; bottom: 44px; width: 1px; background: var(--line); }
.t-stage { display: flex; justify-content: center; align-items: flex-end; padding: 0 2%; }
.t-stage img { width: calc(var(--kt, .2) * var(--w) * 1px); height: auto; flex: none; max-width: none; transition: opacity .25s ease; }
.toggle { font: 300 22px/1 var(--sans); width: 22px; text-align: center; transition: transform .3s ease; display: inline-block; }
.t-robots[aria-expanded="true"] .toggle { transform: rotate(45deg); }
.t-robots[aria-expanded="true"] .t-stage img { opacity: .16; }

/* ---------- the band the robots tile opens: robots only, no text ---------- */
.band { overflow: hidden; padding: 0 var(--m); }
.row { display: flex; justify-content: center; align-items: flex-end; gap: var(--gap, 0px); padding-top: 12px; }
.bot { position: relative; display: flex; align-items: flex-end; flex: none; cursor: pointer; transition: opacity .16s ease; }
.bot img { width: calc(var(--k, .5) * var(--w) * 1px); height: auto; max-width: none; flex: none; }
.row.hovering .bot:not(:hover):not(:focus-visible) { opacity: .32; }
.cap { position: absolute; left: 50%; transform: translateX(-50%); top: calc(100% + 6px); white-space: nowrap; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; opacity: 0; transition: opacity .16s ease; }
.cap b { font-weight: 700; margin-right: .5em; }
.cap span { font-family: var(--mono); color: var(--mute); letter-spacing: 0; }
.bot:hover .cap, .bot:focus-visible .cap { opacity: 1; }
.band-foot { height: 64px; }
.mcap { display: none; }
.bcap { display: none; }
#home.snap .tile, #home.snap .row, #home.snap .bot, #home.snap .bot img { transition: none !important; }

/* ---------- robot page: the robot, its name standing beside it in the render's perspective, and one line ---------- */
.case { transition: opacity .22s ease; overflow-x: clip; }
.case.pre { opacity: 0; transition: none; }
.case > * { transition: opacity .32s ease; }
.case.entering > *:not(.herosec) { opacity: 0; transition: none; }
.crumbs { position: relative; z-index: 3; padding-top: 14px; display: flex; font-size: 20px; line-height: 1; }
.crumbs a { padding: 4px 8px 4px 0; }
.crumbs a:hover { color: var(--red); }
.scene { position: relative; margin: 0; }
.scene .heroimg { position: absolute; max-width: none; pointer-events: none; }
.world { position: absolute; inset: 0; transform-style: preserve-3d; pointer-events: none; }
.world svg { position: absolute; transform-origin: 0 0; overflow: visible; }
.world text { font-family: var(--sans); }
.world a { pointer-events: auto; cursor: pointer; }
.world a:hover .ext { stroke: var(--red); }
.ptext { transition: opacity .35s ease; }
.ptext.off { opacity: 0; transition: none; }
/* ---------- the atmosphere: a soft, grainy light that drifts very slowly behind everything ----------
   A tiny canvas (about 96 px wide) is painted with a few large pale light and shade pools and stretched over the screen,
   so the stretch itself does the blurring; a fixed tile of grain sits on top. Redrawn at most ~24 times a second. */
.atmos, .grain { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
.atmos { transition: opacity 2.4s ease; }
.grain { background-size: 180px 180px; }
html.intro:not(.lit) .atmos { opacity: 0; }

/* ---------- opening the site: the light comes up, the Miata drives in and stops, WIP flickers on, and only then
   does everything else fade in, once, all together ---------- */
html.intro .bar, html.intro .tabbar, html.intro .t-robots, html.intro .more, html.intro .t-miata .t-cap, html.intro:not(.rolling) .car { opacity: 0; pointer-events: none; }
html.intro.rolling .car { animation: in-car .9s ease both; }
@keyframes in-car { from { opacity: 0; } }
html.play .bar, html.play .tabbar, html.play .t-robots, html.play .more, html.play .t-miata .t-cap { animation: in-soft 1.3s cubic-bezier(.2,.7,.2,1) both; }
@keyframes in-soft { from { opacity: 0; translate: 0 10px; } }
.soon { padding-top: 56px; padding-bottom: 120px; }
.soon p { grid-column: 1 / -1; margin: 0; text-align: center; font-size: 15px; font-weight: 800; letter-spacing: .01em; text-transform: uppercase; color: #7a7b76; }

canvas.seq { position: fixed; left: 0; top: 0; z-index: 30; pointer-events: none; will-change: transform; }
.tabbar { display: none; }

@media (max-width: 760px) {
  :root { --m: 16px; --g: 12px; --head: 56px; }
  .bar { grid-template-columns: auto 1fr; }
  .logo img { height: 18px; }
  .name { justify-self: end; font-size: 12px; }
  .links { display: none; }
  .tabbar { display: flex; position: fixed; z-index: 20; left: 0; right: 0; bottom: 0; justify-content: space-around;
    padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    font-size: 12px; letter-spacing: .06em; text-transform: uppercase; border-top: 1px solid var(--line); }
  .grid { grid-template-columns: minmax(0, 1fr); }
  .grid > * { grid-column: 1 / -1 !important; }
  .hero { row-gap: 28px; padding-top: 52px; }
  .sp { display: none; }
  .herowrap { padding-bottom: 72px; }
  .more { position: static; padding-top: 44px; }
  #home.open .more { display: none; }
  #home.open .herowrap { padding-bottom: 6px; }
  #home.open .t-robots .t-stage { display: none; }
  /* open on a phone: the caption stays under the robots (the band's own copy of it) instead of jumping above them */
  #home.open .t-robots .t-cap { display: none; }
  .t-robots[aria-expanded="true"] { padding-top: 18px; }
  .bcap { display: flex; width: 100%; padding: 16px 0 0; height: 40px; background: none; border: 0; color: inherit; font-family: inherit; text-align: left; cursor: pointer; }
  .bcap .nm { opacity: 1; }
  .bcap .toggle { transform: rotate(45deg); }
  .mcap { padding-top: 6px !important; }
  .row { padding-top: 0; }
  .t-robots::before { display: none; }
  .t-robots { border-top: 1px solid var(--line); padding-top: 24px; }
  .t-cap .nm { opacity: 1; }
  .row { overflow-x: auto; overflow-y: hidden; justify-content: flex-start; gap: 0; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain;
    margin: 0 calc(-1 * var(--m)); }
  .row::-webkit-scrollbar { display: none; }
  .row .slide { scroll-snap-stop: always; flex: 0 0 54vw; display: flex; justify-content: center; align-items: flex-end; scroll-snap-align: center; }
  .row { transition: height .3s ease; }
  .row .slide:first-child { margin-left: 23vw; } .row .slide:last-child { margin-right: 23vw; }
  .row .slide:not(.on) .bot { opacity: .5; }
  .row.hovering .bot:not(:hover) { opacity: 1; }
  .row .cap { display: none; }
  .mcap { display: flex; justify-content: space-between; align-items: baseline; padding-top: 12px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
  .mcap b { margin-right: .5em; }
  .mcap .yr { font-family: var(--mono); color: var(--mute); letter-spacing: 0; }
  .dots { display: flex; gap: 6px; }
  .dots i { width: 14px; height: 2px; background: var(--line); }
  .dots i.on { background: var(--ink); }
  .band-foot { height: calc(72px + env(safe-area-inset-bottom, 0px)); }   /* clears the bottom link bar */
  /* until the write-up arrives, the robot, its name and the note sit centred in the space between the bars */
  .case:not([hidden]) { display: flex; flex-direction: column; min-height: calc(100svh - var(--head)); padding-bottom: calc(46px + env(safe-area-inset-bottom, 0px)); }
  .case .herosec { margin-top: auto; }
  .case .soon { margin-bottom: auto; padding-top: 28px; padding-bottom: 44px; }
  .soon p { font-size: 13px; }
}

/* ---------- version B: type with gravitas ----------
   Fewer sizes, lighter and smaller, wide tracking on every small-caps label, one soft near-black and one grey.
   Words arrive letter by letter (a short rise out of a slight blur), once, after WIP has flickered on;
   hover captions spell themselves in; links open their tracking a little under the pointer. */
:root { --ink: #1f1f1d; --mute: #8d8e88; }
.name { font-size: 11px; font-weight: 600; letter-spacing: .38em; margin-right: -.38em; }
.name b { font-weight: 600; }
.links { gap: 36px; font-size: 10.5px; font-weight: 500; letter-spacing: .26em; }
.links a, .tabbar a { transition: letter-spacing .6s cubic-bezier(.2,.7,.2,1), color .3s ease; }
.links a:hover { color: var(--ink); letter-spacing: .36em; }
.t-cap { font-size: 10.5px; font-weight: 600; letter-spacing: .24em; }
.t-cap .sub { font-weight: 500; }
.more { font-size: 10px; font-weight: 500; letter-spacing: .5em; padding-left: .5em; color: var(--mute); }
.cap { font-size: 10.5px; letter-spacing: .24em; top: calc(100% + 10px); }
.cap b { font-weight: 600; margin-right: 1.1em; }
.cap span { font-family: var(--sans); letter-spacing: .24em; }
.soon p { font-size: 10.5px; font-weight: 500; letter-spacing: .5em; padding-left: .5em; color: var(--mute); }
.wip { color: #7b7c77; }
/* round 2: WIP is hollow, a fine grey outline with a pale glassy fill, fading out toward the floor so it sinks into the light */
html.intro:not(.wipped) .wip { opacity: 0; }   /* never visible before its flicker */
.wip { color: transparent; -webkit-text-stroke: 1.5px rgba(78, 79, 74, .62); letter-spacing: .01em;
  -webkit-mask-image: linear-gradient(to bottom, #000 30%, rgba(0,0,0,.18) 100%); mask-image: linear-gradient(to bottom, #000 30%, rgba(0,0,0,.18) 100%); }
.wip .wi { display: inline-block; }
/* lean: tipped back, as if propped up behind the car */
html[data-wip="lean"] .wip { transform-origin: 50% 100%; transform: translateX(-50%) perspective(calc(var(--ws, 300) * 2.6px)) rotateX(30deg); }
/* arc: the letters fan out over a gentle arch */
html[data-wip="arc"] .wip .wi { transform-origin: 50% 100%; }
html[data-wip="arc"] .wip .wi:nth-child(1) { transform: translateY(.05em) rotate(-6deg); }
html[data-wip="arc"] .wip .wi:nth-child(2) { transform: translateY(-.04em); }
html[data-wip="arc"] .wip .wi:nth-child(3) { transform: translateY(.05em) rotate(6deg); }
/* wrap: the word bends around a big cylinder behind the car, its ends turning away from you */
html[data-wip="wrap"] .wip { perspective: calc(var(--ws, 300) * 2.2px); }
html[data-wip="wrap"] .wip .wi:nth-child(1) { transform-origin: 100% 50%; transform: rotateY(-38deg); }
html[data-wip="wrap"] .wip .wi:nth-child(3) { transform-origin: 0% 50%; transform: rotateY(38deg); }
/* echo: two fainter outlines trail behind, like the car's wake */
html[data-wip="echo"] .wip::before, html[data-wip="echo"] .wip::after { content: "WIP"; position: absolute; left: 0; top: 0; color: transparent; pointer-events: none; }
html[data-wip="echo"] .wip::before { translate: -.07em 0; -webkit-text-stroke: 1.2px rgba(78, 79, 74, .3); }
html[data-wip="echo"] .wip::after { translate: -.14em 0; -webkit-text-stroke: 1px rgba(78, 79, 74, .14); }
@media (max-width: 760px) { .wip { -webkit-text-stroke-width: 1.1px; } }
/* round 6: the top bar. Logo and name lock up on the left (hollow mark, a hairline, the name); the links sit right on the
   same centre line; a hairline under the bar fades out at both ends. Links underline themselves from the left on hover. */
:root { --head: 72px; }
.bar { grid-template-columns: auto auto 1fr; height: var(--head); }
.bar .logo { display: flex; align-items: center; }
.bar .logo img { height: 26px !important; }
.bar .name { justify-self: start; display: flex; align-items: center; height: 20px; margin-left: 18px; padding-left: 18px; border-left: 1px solid rgba(60, 61, 57, .3);
  font-size: 12px !important; font-weight: 600; letter-spacing: .06em !important; margin-right: 0 !important; }
.bar::after { content: ""; position: absolute; left: var(--pad); right: var(--pad); bottom: 0; height: 1px; pointer-events: none;
  background: linear-gradient(90deg, transparent, rgba(60, 61, 57, .16) 14%, rgba(60, 61, 57, .16) 86%, transparent); }
.bar .links { gap: 34px !important; font-weight: 500; }
.bar .links a { position: relative; letter-spacing: .06em !important; }
.bar .links a::after { content: ""; position: absolute; left: 0; right: .06em; bottom: -6px; height: 1px; background: currentColor; transform: scaleX(0); transform-origin: 0 50%;
  transition: transform .5s cubic-bezier(.2,.7,.2,1); }
.bar .links a:hover::after, .bar .links a:focus-visible::after { transform: scaleX(1); }
.bar .links a:hover { color: var(--ink); }
@media (max-width: 760px) {
  :root { --head: 60px; }
  .bar { grid-template-columns: auto auto 1fr; height: var(--head); }
  .bar .logo img { height: 21px !important; }
  .bar .name { justify-self: start; margin-left: 14px; padding-left: 14px; height: 18px; font-size: 11.5px !important; }
  .bar::after { left: 16px; right: 16px; }
}

/* ---------- top bar options (?bar=lockup | corners | capsule | rails) ---------- */
/* bars whose parts are pinned to the screen must not move as a block while fading in (a moving parent would drag them) */
html[data-bar="corners"].play .bar, html[data-bar="rails"].play .bar { animation-name: in-fade; }
@keyframes in-fade { from { opacity: 0; } }
html[data-bar="corners"].scrolled .bar, html[data-bar="rails"].scrolled .bar { background: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
html[data-bar="corners"] .bar::after, html[data-bar="rails"] .bar::after, html[data-bar="capsule"] .bar::after { display: none; }
@media (min-width: 761px) {
  /* corners: the logo alone top-left, the links stacked in the top-right corner like a gallery label, the name up the left margin */
  html[data-bar="corners"] .bar .links { grid-column: 3; justify-self: end; text-align: right; flex-direction: column; align-items: flex-end; gap: 7px !important; align-self: start; padding-top: 22px; font-size: 11px; line-height: 1.25; }
  html[data-bar="corners"] .bar .links a::after { bottom: -2px; }
  /* rails: name up the left edge, links down the right edge, a hairline along each margin like a drawing sheet's border */

<script>
/* the atmosphere (see the CSS). Light pools are pale versions of the paper; nothing here is darker than a light grey. */
(() => {
  const cv = document.getElementById('atmos'), gr = document.getElementById('grain');
  if (!cv || !cv.getContext) return;
  const q = new URLSearchParams(location.search), AMT = +(q.get('bg') || 1);   /* ?bg=0.5 softer, ?bg=1.5 stronger */
  /* grain: one 180 px tile of fine light and dark specks */
  const g = document.createElement('canvas'); g.width = g.height = 180; const gx = g.getContext('2d'), gd = gx.createImageData(180, 180);
  for (let i = 0; i < gd.data.length; i += 4) { const v = Math.random(), lt = v > .5; gd.data[i] = gd.data[i + 1] = gd.data[i + 2] = lt ? 255 : 40; gd.data[i + 3] = Math.abs(v - .5) * 2 * (lt ? 34 : 22); }
  gx.putImageData(gd, 0, 0); gr.style.backgroundImage = `url(${g.toDataURL()})`;
  const P = [240, 240, 236];
  /* pools: colour, strength, radius (share of the long side), home (x, y), drift (x, y amplitude), periods in seconds, phase */
  const POOLS = [
    { c: [253, 253, 251], a: .95, r: .60, h: [.72, .22], d: [.34, .26], t: [29, 23], p: 0.0 },
    { c: [206, 207, 200], a: .72, r: .56, h: [.18, .78], d: [.30, .24], t: [37, 26], p: 1.7 },
    { c: [250, 250, 247], a: .85, r: .46, h: [.32, .30], d: [.32, .30], t: [24, 33], p: 3.1 },
    { c: [216, 217, 211], a: .66, r: .50, h: [.86, .84], d: [.28, .30], t: [41, 31], p: 4.4 },
    { c: [228, 229, 224], a: .60, r: .40, h: [.50, .55], d: [.40, .34], t: [19, 27], p: 2.2 },
  ];
  const cx = cv.getContext('2d', { alpha: false }); let W = 0, H = 0;
  const size = () => { const ar = innerHeight / Math.max(1, innerWidth); W = 96; H = Math.max(24, Math.round(96 * ar)); cv.width = W; cv.height = H; };
  const draw = t => {
    cx.fillStyle = `rgb(${P})`; cx.fillRect(0, 0, W, H);
    const L = Math.max(W, H);
    for (const o of POOLS) {
      const x = (o.h[0] + o.d[0] * Math.sin(t / o.t[0] * 6.283 + o.p)) * W, y = (o.h[1] + o.d[1] * Math.sin(t / o.t[1] * 6.283 + o.p * 1.3)) * H;
      const r = o.r * L * (1 + .16 * Math.sin(t / 11 + o.p)), a = Math.min(1, o.a * AMT);

      gg.addColorStop(0, `rgba(${c},${a})`); gg.addColorStop(.45, `rgba(${c},${a * .55})`); gg.addColorStop(1, `rgba(${c},0)`);

  const T0 = performance.now() - 20000 * Math.random(), clock = () => (performance.now() - T0) / 1000;

  const STEP = 1000 / 30; let last = 0;
  const tick = now => { if (now - last >= STEP) { last = now; draw(clock()); } requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
})();

<script>
/* version B: split words into letters for the kinetic type. kin(el) splits once; kin(el, true) re-plays the entrance. */
window.kin = (el, replay) => {
  if (!el) return;
  const txt = el.textContent;
  if (el.dataset.kt !== txt) {   /* (re)split when the words changed */
    if (el.dataset.kin !== undefined) el.style.setProperty('--d', (+el.dataset.kin || 0) + 'ms');
    let i = 0;
    const walk = n => { [...n.childNodes].forEach(c => {
      if (c.nodeType === 3) { const f = document.createDocumentFragment();
        for (const chr of c.textContent) { const sp = document.createElement('span'); sp.className = 'ch'; sp.style.setProperty('--i', i++); sp.textContent = chr; f.appendChild(sp); }
        c.replaceWith(f); }
      else if (c.nodeType === 1 && !c.classList.contains('ch')) walk(c); }); };
    walk(el); el.classList.add('kin'); el.dataset.kt = el.textContent;
    if (!el.closest('a, button') && !el.getAttribute('aria-label')) el.setAttribute('aria-label', txt.trim());
  }
  if (replay) { el.classList.add('re'); void el.offsetWidth; el.classList.remove('re'); }
};
document.addEventListener('DOMContentLoaded', () => document.querySelectorAll('[data-kin]').forEach(el => kin(el)));

    requestAnimationFrame(() => { const an = c.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 180, easing: 'ease-out', fill: 'forwards' });
      const end = () => { c.remove(); r(); }; an.onfinish = end; an.oncancel = end; }); });

  async function openCase(y, srcImg) {
    if (busy || current === y) return; busy = true;
    if (!popping) hist('push', { r: y, own: true }, '#r' + y);
    try {
    const seqP = frames(y);
    const fromRect = srcImg ? srcImg.getBoundingClientRect() : null;
    const visible = fromRect && fromRect.bottom > 0 && fromRect.top < innerHeight && fromRect.width > 0;
    let hold = null;
    if (visible && !reduce) {
      hold = holdAt(srcImg, fromRect); srcImg.style.visibility = 'hidden';
      const fade = current === 'home' ? [...home.querySelectorAll('.tile, .mcap, #row .bot')] : [...cs.children];
      fade.forEach(el => { if (!el.contains(srcImg)) el.animate([{ opacity: getComputedStyle(el).opacity }, { opacity: 0 }], { duration: 180, fill: 'forwards' }); });
      await Promise.all([seqP, new Promise(r => setTimeout(r, 160))]);
    }
    cs.innerHTML = caseHTML(y); cs.classList.add('pre'); { const sp = cs.querySelector('.soon p'); sp.style.setProperty('--d', '350ms'); kin(sp); sp.classList.add('re'); }
    home.hidden = true; cs.hidden = false; scrollTo(0, 0); current = y; layoutScene();
    const hero = $('#heroImg'), pt = $('#ptext');
    await (hero.decode ? hero.decode().catch(() => {}) : 0);
    if (visible && !reduce) {
      hero.style.visibility = 'hidden'; cs.classList.add('entering'); cs.classList.remove('pre');
      seqYear = y;
      const imgs = await seqP; imgs[0] = imgs[0] || srcImg; imgs[imgs.length - 1] = imgs[imgs.length - 1] || hero;
      const pr = playSeq(imgs, fromRect, hero.getBoundingClientRect(), true);
      if (hold) hold.remove();                         /* the canvas has already drawn its first frame */
      const c = await pr;
      await handOff(c, hero);
      cs.classList.remove('entering');                 /* only the text and pictures fade in; the robot never blinks */
    }
    cs.classList.remove('pre');
    requestAnimationFrame(() => { pt.classList.remove('off'); const sp = cs.querySelector('.soon p'); if (sp) sp.classList.remove('re'); });
    if (hold) hold.remove();
    if (srcImg) srcImg.style.visibility = '';
    home.getAnimations({ subtree: true }).forEach(a => a.cancel());
    } finally { busy = false; if (backLater) { backLater = false; setTimeout(back, 0); } }
  }

  async function goHome() {
    if (busy || current === 'home') return; busy = true;
    try {
    const y = current, hero = $('#heroImg'), seqP = frames(y);
    const fromRect = hero ? hero.getBoundingClientRect() : null;
    const visible = fromRect && fromRect.bottom > 0 && fromRect.top < innerHeight;
    let hold = null;
    if (visible && !reduce) {
      hold = holdAt(hero, fromRect);
      [...cs.children].filter(el => !el.classList.contains('herosec')).forEach(el => el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 160, fill: 'forwards' }));
      $('#ptext').classList.add('off');
      await Promise.all([seqP, new Promise(r => setTimeout(r, 150))]);
    }
    cs.hidden = true; home.hidden = false; current = 'home';
    if (!open) await setBand(true, { instant: true });
    fit();
    scrollTo(0, Math.max(0, band.getBoundingClientRect().top + scrollY - head() - 16));
    const i = ORDER.indexOf(y); if (phone()) centre(i, false);
    const target = row.querySelector(`.bot[data-y="${y}"] img`);
    if (visible && !reduce) {
      target.style.visibility = 'hidden';
      [...home.querySelectorAll('.tile, .mcap, #row .bot')].filter(el => !el.contains(target))
        .forEach(el => el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 260, delay: 560, fill: 'backwards' }));
      seqYear = y;
      const imgs = await seqP; imgs[0] = imgs[0] || target; imgs[imgs.length - 1] = imgs[imgs.length - 1] || hero;
      const pr = playSeq(imgs, fromRect, target.getBoundingClientRect(), false);
      if (hold) hold.remove();
      const c = await pr;
      await handOff(c, target);
    }
    if (hold) hold.remove();
    cs.innerHTML = '';
    } finally { busy = false; }
  }

  let popping = false;
  const hist = (k, st, url) => { try { k === 'push' ? history.pushState(st, '', url) : history.replaceState(st, '', url); } catch (e) {} };
  /* in-page back: step the browser history when we added the entry, so the phone back gesture and this link agree */
  let backLater = false;
  function back() {
    if (busy && current !== 'home') { backLater = true; return; }   /* tapped mid-turn: go back as soon as it lands */
    if (busy || current === 'home') return;
    hist('push', { home: true, own: true }, location.pathname + location.search);
    goHome();
  }
  addEventListener('popstate', async e => {
    const r = e.state && e.state.r;
    while (busy) await new Promise(res => setTimeout(res, 50));
    popping = true;
    try { if (r && M.r[r]) { if (current !== r) await go(r); } else if (current !== 'home') await goHome(); }
    finally { popping = false; }
  });
  function go(where, srcImg) {
    if (where === 'home') return goHome();
    if (current === 'home' && !srcImg) {
      if (!open) setBand(true, { instant: true });
      scrollTo(0, Math.max(0, band.getBoundingClientRect().top + scrollY - head() - 16));
      if (phone()) centre(ORDER.indexOf(where), false);
      srcImg = row.querySelector(`.bot[data-y="${where}"] img`);
    }
    return openCase(where, srcImg);
  }

  document.addEventListener('click', e => {
    const g = e.target.closest('[data-go]');
    if (g) { e.preventDefault(); back(); return; }
    const b = e.target.closest('.bot'); if (!b) return;
    e.preventDefault();
    if (phone() && b.closest('#row')) { const i = +b.closest('.slide').dataset.i; if (i !== active) { centre(i, true); return; } }
    go(b.dataset.y, b.querySelector('img'));
  });
  row.addEventListener('pointerover', e => { const b = e.target.closest('.bot'); if (b) frames(b.dataset.y); });
  tile.addEventListener('pointerenter', () => frames(TILE));
  setTimeout(() => [...ORDER].reverse().forEach(prime), document.documentElement.classList.contains('intro') ? 7000 : 300);   /* the opening's drive-in frames go first; the turns follow once it has played */
  /* download the turns early (newest first); unpack only on demand */

  addEventListener('resize', fit);
  $('#car').addEventListener('load', fit);
  if (document.fonts) document.fonts.ready.then(() => current !== 'home' && layoutScene());
  fit();
  addEventListener('message', e => { const d = e.data; if (!d) return;
    if (d.jtgo === 'home') { if (current !== 'home') goHome(); else setBand(false); }
    else if (d.jtgo === 'band') { if (current !== 'home') goHome(); else setBand(true); }
    else if (d.jtgo && M.r[d.jtgo]) go(d.jtgo);
  });
  /* The Miata drives in from the left edge as the page opens. img/drivein holds rendered frames (a stock NA braking from 40 km/h:
     nose dive, front lock-up, smoke, settle) on a canvas bigger than the still; meta.json says where the still sits in it (still_at),
     and how far the car still has to travel in each frame (x, in car-picture widths). The frames are mirrored like the still, and the
     last frame is the still itself, so the canvas just goes away at the end. Only the frames from where the car reaches the screen are fetched. */
  function driveIn() {
    const car = $('#car'), stage = $('#mstage');
    if (!car || !stage || carPick || !car.offsetWidth || !window.requestAnimationFrame) return Promise.resolve(null);
    return fetch('img/drivein/meta.json').then(r => r.json()).then(D => {
      const cw = car.offsetWidth, k = cw / D.still_at[2], N = D.frames;
      const tier = cw * (devicePixelRatio || 1) <= 700 ? 's' : 'l';
      const edge = car.getBoundingClientRect().right + D.still_at[0] * k;   /* the car is on screen once it has less than this left to go */
      let s0 = 0; for (let f = 0; f < N; f++) if (D.x[f] * cw < edge) { s0 = Math.max(0, f - 1); break; }
      const ims = [], loads = [];
      for (let f = s0; f < N - 1; f++) { const im = new Image(); im.src = `img/drivein/${tier}/${pad(f)}.webp`; ims[f] = im;
        loads.push(new Promise((ok, no) => { im.onload = ok; im.onerror = no; })); }
      return Promise.all(loads).then(() => () => new Promise(stopped => {
        const cv = document.createElement('canvas'); cv.className = 'drive'; cv.width = D.tiers[tier][0]; cv.height = D.tiers[tier][1];
        const c2 = cv.getContext('2d');
        cv.style.cssText = `left:${car.offsetLeft - D.still_at[0] * k}px;top:${car.offsetTop - D.still_at[1] * k}px;width:${D.canvas[0] * k}px;height:${D.canvas[1] * k}px;transform-origin:${D.still_at[0] * k + cw / 2}px 50%`;
        stage.appendChild(cv); car.style.visibility = 'hidden';
        const flash = stopped;   /* the car has stopped: the opening flickers WIP on from here */
        const t0 = performance.now(); let shown = -1;
        const step = now => {
          const fp = s0 + Math.max(0, now - t0) / 1000 * D.fps, f = Math.floor(fp);
          if (f >= D.stop) flash();
          if (f >= N - 1 || !cv.isConnected) { flash(); car.style.visibility = ''; cv.remove(); return; }
          const x = (D.x[f] + (D.x[f + 1] - D.x[f]) * (fp - f)) * cw;
          cv.style.transform = `translate3d(${(-x).toFixed(2)}px,0,0) scaleX(-1)`;
          if (f !== shown) { c2.clearRect(0, 0, cv.width, cv.height); c2.drawImage(ims[f], 0, 0); shown = f; }
          requestAnimationFrame(step);
        };
        step(t0);
      }));
    }).catch(() => null);
  }
  /* the entrance waits for the two pictures so nothing pops in halfway (gives up after three seconds), then up to 1.8 s more for the
     drive-in frames; on a slow line the page simply opens with the car already parked */
  if (document.documentElement.classList.contains('intro')) {
    const pics = [$('#car'), $('#tstage img')].filter(Boolean).map(im => im.decode ? im.decode().catch(() => {}) : 0);
    const de = document.documentElement, stage = $('#mstage'), t0 = performance.now();
    stage.classList.add('wip-wait');
    requestAnimationFrame(() => de.classList.add('lit'));   /* the light comes up first */
    const flicker = () => new Promise(done => { de.classList.add('wipped'); stage.classList.remove('wip-wait'); stage.classList.add('wip-flash'); setTimeout(() => { stage.classList.remove('wip-flash'); done(); }, 600); });
    let shown = false;
    const reveal = () => { if (shown) return; shown = true; stage.classList.remove('wip-wait', 'wip-flash');
      de.classList.add('play'); de.classList.remove('intro', 'rolling'); setTimeout(() => de.classList.remove('play'), 1500); };
    Promise.race([Promise.all(pics), wait(3000)]).then(() => { fit(); return Promise.race([driveIn(), wait(1800).then(() => null)]); })
      .then(drive => wait(Math.max(0, 1200 - (performance.now() - t0))).then(() => drive))   /* let the light settle a moment */
      .then(drive => { fit(); de.classList.add('rolling');
        return typeof drive === 'function' ? drive() : wait(1000); })   /* drives in and stops (or, if the frames were late, fades in parked) */
      .then(flicker).then(() => wait(350)).then(reveal);
    setTimeout(reveal, 12000);   /* never leave the page dark */
  }
  const h = location.hash.replace('#r', '');
  if (R[h] && M.r[h]) { hist('replace', { r: h }, location.href); home.hidden = true; cs.hidden = false; current = h;
    cs.innerHTML = caseHTML(h); layoutScene(); $('#ptext').classList.remove('off'); }
  else if (location.hash === '#band') setBand(true, { instant: true });
})();
</script>
