if (!/^#r\d/.test(location.hash) && !matchMedia('(prefers-reduced-motion: reduce)').matches && ((performance.getEntriesByType && performance.getEntriesByType('navigation')[0]) || {}).type !== 'back_forward') document.documentElement.classList.add('intro');</script>
<style>
/* jthutto.com, round 7: one quiet system. One small size for every word of UI (13 px), two weights (400 text, 500 names
   and labels), one grey, sentence case, no tracking. The robots, the Miata drive-in, the perspective floor and the slow
   light are the only things that move. Every robot is rendered by one shared camera (85 mm, 4.5 m, eye 45 cm), so they
   share a scale and a horizon. */
:root {
  --paper: #f0f0ec; --ink: #1f1f1d; --mute: #85867f; --line: #d2d3cc;
  /* Breul Grotesk is the pick; until the font files arrive, Archivo stands in. */
  --sans: "Breul Grotesk", "Archivo", "Helvetica Neue", Arial, sans-serif;
  --t: 13px;
  --m: 40px; --g: 20px; --head: 72px;
  --maxw: 1440px; --pad: max(var(--m), calc((100vw - var(--maxw)) / 2));
  color-scheme: only light;
}
* { box-sizing: border-box; }
html { background: var(--paper); }
html, body { margin: 0; color: var(--ink); }
body { font: 400 var(--t)/1.4 var(--sans); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
:focus-visible { outline: 1px solid var(--ink); outline-offset: 4px; }
img { display: block; max-width: 100%; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- the one bar: mark and name on the left, three links on the right ---------- */
.bar { position: sticky; top: 0; z-index: 20; height: var(--head); display: flex; align-items: center; gap: 14px;
  padding: 0 max(var(--pad), env(safe-area-inset-right, 0px)) 0 max(var(--pad), env(safe-area-inset-left, 0px));
  transition: background-color .3s ease, box-shadow .3s ease; }
html.scrolled .bar { background: rgba(240, 240, 236, .86); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); box-shadow: 0 1px 0 var(--line); }
.logo img { height: 22px; width: auto; }
.name { font-weight: 500; white-space: nowrap; }
.links { margin-left: auto; display: flex; gap: 28px; }
.links a { color: var(--mute); transition: color .2s ease; }
.links a:hover, .links a:focus-visible { color: var(--ink); }
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--g); padding: 0 var(--pad); }

/* the one status label: a small hollow ring and one word, in the grey */
.status { display: inline-flex; align-items: center; gap: 8px; font-weight: 400; color: var(--mute); white-space: nowrap; }
.status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; border: 1px solid currentColor; flex: none; }

/* ---------- home: two projects, one screen ---------- */
#home { display: flex; flex-direction: column; }
#home[hidden], .case[hidden] { display: none; }
.sp { flex: 1 1 0; }
.herowrap { position: relative; flex: none; }
.hero { align-items: stretch; }
@media (min-width: 761px) {
  .herosec .scene { margin: 0 auto; }
  .case:not([hidden]) { display: flex; flex-direction: column; min-height: calc(100svh - var(--head)); }
  .case .herosec { margin-top: auto; }
  .case .note { margin-bottom: auto; padding-top: 40px; padding-bottom: 72px; }
  .herowrap { transform-origin: 50% 0; }
  #home.open .herowrap { transform: scale(var(--hs, 1)); margin-bottom: calc(var(--hd, 0) * -1px); }
  #home { height: calc(100svh - var(--head)); min-height: 560px; overflow: hidden; }
  #home.open .sp-top { flex: 0 0 20px; }
  .band { flex: none; height: calc(var(--bandH, 400) * 1px); display: flex; flex-direction: column; justify-content: center; padding-bottom: 36px; }
  .band[hidden] { display: none; }
  .band-foot { display: none; }
}
.tile { position: relative; display: flex; flex-direction: column; justify-content: flex-end; min-width: 0; }
/* captions: always there, one line, name left and status or toggle right */
.t-cap { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 20px; height: 44px; font-weight: 500; }
.t-cap .nm { display: flex; align-items: center; gap: 8px; white-space: nowrap; overflow: hidden; }
.t-cap .lg { height: 14px; width: auto; flex: none; }
.t-cap .lg-first { height: 15px; }
.t-cap .lg-miata { height: 14px; transform: translateY(-2.5px); margin-right: 10px; }   /* the script hangs below its baseline; lift it to sit with the caps */
.t-miata { grid-column: 1 / span 7; cursor: default; }
.m-stage { position: relative; display: flex; justify-content: center; align-items: flex-end; flex: 1; }
.m-stage .car { position: relative; z-index: 1; width: calc(var(--cw, 600) * 1px); height: auto; max-width: none; flex: none; transform: scaleX(-1); }   /* mirrored: faces right, drives in from the left */
.m-stage .drive { position: absolute; z-index: 1; max-width: none; pointer-events: none; will-change: transform; }
/* WIP: a hollow outline with two fainter echoes trailing behind, like the car's wake. Dark until the car stops, then it flickers on. */
.wip { position: absolute; z-index: 0; left: 50%; transform: translateX(-50%); bottom: calc(var(--wb, 40) * 1px);
  font: 900 calc(var(--ws, 300) * 1px)/.74 var(--sans); font-stretch: 112%; letter-spacing: .01em; white-space: nowrap; pointer-events: none; user-select: none;
  color: transparent; -webkit-text-stroke: 1.5px rgba(78, 79, 74, .62);
  -webkit-mask-image: linear-gradient(to bottom, #000 30%, rgba(0,0,0,.18) 100%); mask-image: linear-gradient(to bottom, #000 30%, rgba(0,0,0,.18) 100%); }
.wip::before, .wip::after { content: "WIP"; position: absolute; left: 0; top: 0; color: transparent; pointer-events: none; }
.wip::before { translate: -.07em 0; -webkit-text-stroke: 1.2px rgba(78, 79, 74, .3); }
.wip::after { translate: -.14em 0; -webkit-text-stroke: 1px rgba(78, 79, 74, .14); }
.m-stage.wip-wait .wip { opacity: 0; }
.m-stage.wip-flash .wip { animation: wip-flash .5s linear both; }
@keyframes wip-flash { 0% { opacity: 0; } 10% { opacity: 1; } 22% { opacity: .1; } 36% { opacity: 1; } 48% { opacity: .45; } 62%, 100% { opacity: 1; } }
.t-robots { grid-column: 8 / span 5; cursor: pointer; }
.t-robots::before { content: ""; position: absolute; left: calc(var(--g) * -0.5 - 0.5px); top: 0; bottom: 44px; width: 1px; background: var(--line); }
.t-stage { position: relative; z-index: 1; display: flex; justify-content: center; align-items: flex-end; padding: 0 2%; }
.t-stage img { width: calc(var(--kt, .2) * var(--w) * 1px); height: auto; flex: none; max-width: none; transition: opacity .25s ease; }
.toggle { font: 300 20px/1 var(--sans); width: 20px; text-align: center; transition: transform .3s ease; display: inline-block; }
.t-robots[aria-expanded="true"] .toggle { transform: rotate(45deg); }
.t-robots[aria-expanded="true"] .t-stage img { opacity: .16; }

/* ---------- the band the robots tile opens ---------- */
.band { overflow: hidden; padding: 0 var(--pad); }
.row { display: flex; justify-content: center; align-items: flex-end; gap: var(--gap, 0px); padding-top: 12px; }
.bot { position: relative; display: flex; align-items: flex-end; flex: none; cursor: pointer; transition: opacity .16s ease; }
.bot img { width: calc(var(--k, .5) * var(--w) * 1px); height: auto; max-width: none; flex: none; }
.row.hovering .bot:not(:hover):not(:focus-visible) { opacity: .32; }
.cap { position: absolute; left: 50%; transform: translateX(-50%); top: calc(100% + 10px); white-space: nowrap; }
.cap b, .mcap b { font-weight: 500; margin-right: .5em; }
.cap span, .mcap .yr { color: var(--mute); }
.band-foot { height: 64px; }
.mcap { display: none; }
.bcap { display: none; }
#home.snap .tile, #home.snap .row, #home.snap .bot, #home.snap .bot img { transition: none !important; }

/* ---------- robot page ---------- */
.case { transition: opacity .22s ease; overflow-x: clip; }
.case.pre { opacity: 0; transition: none; }
.case > * { transition: opacity .32s ease; }
.case.entering > *:not(.herosec) { opacity: 0; transition: none; }
.crumbs { position: relative; z-index: 3; padding-top: 14px; display: flex; }
.crumbs a { padding: 4px 8px 4px 0; color: var(--mute); transition: color .2s ease; }
.crumbs a:hover, .crumbs a:focus-visible { color: var(--ink); }
.scene { position: relative; margin: 0; }
.scene .heroimg { position: absolute; z-index: 1; max-width: none; pointer-events: none; }
.world { position: absolute; inset: 0; transform-style: preserve-3d; pointer-events: none; }
.world svg { position: absolute; transform-origin: 0 0; overflow: visible; }
.world text { font-family: var(--sans); }
.world a { pointer-events: auto; cursor: pointer; }
.world a:hover .ext { stroke: var(--mute); }
.ptext { transition: opacity .35s ease; }
.ptext.off { opacity: 0; transition: none; }
.note { display: flex; justify-content: center; align-items: center; gap: 14px; }
.note p { grid-column: 1 / -1; margin: 0; display: flex; justify-content: center; gap: 14px; }

/* ---------- the light: a very slow grey drift behind everything, with a fine grain that only shows in its darker
   pools (white specks screened over the light; on near-white paper they vanish) ---------- */
.atmos, .grain, .soft { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
.atmos { transition: opacity 2.4s ease; }
.grain { mix-blend-mode: screen; }
html.intro:not(.lit) .atmos { opacity: 0; }
/* the floor on robot pages: unlabelled hairlines in the render's own perspective, a pool around the robot */
.soft { overflow: hidden; }
.soft .persp { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; opacity: 0; transition: opacity .2s ease; }
.soft .persp.on { opacity: 1; transition: opacity 4.5s cubic-bezier(.45,0,.25,1); }
.persp .g { fill: none; stroke: rgba(60, 61, 57, .12); stroke-width: 1; vector-effect: non-scaling-stroke; }

/* ---------- opening: the light comes up and the Miata drives in and stops; WIP flickers on. Everything else is simply there. ---------- */
html.intro:not(.rolling) .car { opacity: 0; }
html.intro.rolling .car { animation: in-car .9s ease both; }
@keyframes in-car { from { opacity: 0; } }
html.intro:not(.wipped) .wip { opacity: 0; }

canvas.seq { position: fixed; left: 0; top: 0; z-index: 30; pointer-events: none; will-change: transform; }

@media (max-width: 760px) {
  :root { --m: 16px; --g: 12px; --head: 56px; --pad: var(--m); }
  .bar { gap: 10px; }
  .logo img { height: 20px; }
  .links { gap: 16px; }
  .grid { grid-template-columns: minmax(0, 1fr); }
  .grid > * { grid-column: 1 / -1 !important; }
  .hero { row-gap: 28px; padding-top: 44px; }
  .sp { display: none; }
  .herowrap { padding-bottom: 40px; }
  #home.open .herowrap { padding-bottom: 6px; }
  #home.open .t-robots .t-stage { display: none; }
  #home.open .t-robots .t-cap { display: none; }
  .t-robots[aria-expanded="true"] { padding-top: 18px; }
  .bcap { display: flex; width: 100%; padding: 16px 0 0; height: 40px; }
  .bcap .toggle { transform: rotate(45deg); }
  .t-robots::before { display: none; }
  .t-robots { border-top: 1px solid var(--line); padding-top: 24px; }
  .row { padding-top: 0; overflow-x: auto; overflow-y: hidden; justify-content: flex-start; gap: 0; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain;
    margin: 0 calc(-1 * var(--m)); transition: height .3s ease; }
  .row::-webkit-scrollbar { display: none; }
  .row .slide { scroll-snap-stop: always; flex: 0 0 54vw; display: flex; justify-content: center; align-items: flex-end; scroll-snap-align: center; }
  .row .slide:first-child { margin-left: 23vw; } .row .slide:last-child { margin-right: 23vw; }
  .row .slide:not(.on) .bot { opacity: .5; }
  .row.hovering .bot:not(:hover) { opacity: 1; }
  .row .cap { display: none; }
  .mcap { display: flex; justify-content: space-between; align-items: center; padding-top: 12px; }
  .dots { display: flex; gap: 6px; }
  .dots i { width: 14px; height: 2px; background: var(--line); }
  .dots i.on { background: var(--ink); }
  .band-foot { height: calc(40px + env(safe-area-inset-bottom, 0px)); }
  .case:not([hidden]) { display: flex; flex-direction: column; min-height: calc(100svh - var(--head)); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .case .herosec { margin-top: auto; }
  .case .note { margin-bottom: auto; padding-top: 28px; padding-bottom: 44px; }
  .wip { -webkit-text-stroke-width: 1.1px; }
}
@media (max-width: 369px) { .name { display: none; } }
@media (prefers-reduced-motion: reduce) { .bot, .case, .toggle, .t-stage img, .ptext { transition: none !important; } }
</style>

<script>
/* the atmosphere (see the CSS). Light pools are pale versions of the paper; nothing here is darker than a light grey. */
(() => {
  const cv = document.getElementById('atmos'), gr = document.getElementById('grain');
  if (!cv || !cv.getContext) return;
  const q = new URLSearchParams(location.search), AMT = +(q.get('bg') || 1);   /* ?bg=0.5 softer, ?bg=1.5 stronger */
  /* grain: one tile of single-device-pixel white specks, screened over the light, so it only shows in the darker grey pools */
  const dpr = Math.min(3, devicePixelRatio || 1), GT = 256;
  const g = document.createElement('canvas'); g.width = g.height = GT; const gx = g.getContext('2d'), gd = gx.createImageData(GT, GT);
  for (let i = 0; i < gd.data.length; i += 4) { gd.data[i] = gd.data[i + 1] = gd.data[i + 2] = 255; gd.data[i + 3] = Math.pow(Math.random(), 3) * 110; }
  gx.putImageData(gd, 0, 0); gr.style.backgroundImage = `url(${g.toDataURL()})`; gr.style.backgroundSize = `${GT / dpr}px ${GT / dpr}px`;
  const P = [240, 240, 236];
  /* pools: colour, strength, radius (share of the long side), home (x, y), drift (x, y amplitude), periods in seconds, phase */
  const POOLS = [
    { c: [253, 253, 251], a: .95, r: .60, h: [.72, .22], d: [.34, .26], t: [29, 23], p: 0.0 },
    { c: [206, 207, 200], a: .72, r: .56, h: [.18, .78], d: [.30, .24], t: [37, 26], p: 1.7 },
    { c: [250, 250, 247], a: .85, r: .46, h: [.32, .30], d: [.32, .30], t: [24, 33], p: 3.1 },
    { c: [216, 217, 211], a: .66, r: .50, h: [.86, .84], d: [.28, .30], t: [41, 31], p: 4.4 },
    { c: [228, 229, 224], a: .60, r: .40, h: [.50, .55], d: [.40, .34], t: [19, 27], p: 2.2 },
  ];
  const cx = cv.getContext('2d', { alpha: false }); let W = 0, H = 0;
  const size = () => { const ar = innerHeight / Math.max(1, innerWidth); W = 96; H = Math.max(24, Math.round(96 * ar)); cv.width = W; cv.height = H; };
  const draw = t => {
    cx.fillStyle = `rgb(${P})`; cx.fillRect(0, 0, W, H);
    const L = Math.max(W, H);
    for (const o of POOLS) {
      const x = (o.h[0] + o.d[0] * Math.sin(t / o.t[0] * 6.283 + o.p)) * W, y = (o.h[1] + o.d[1] * Math.sin(t / o.t[1] * 6.283 + o.p * 1.3)) * H;
      const r = o.r * L * (1 + .16 * Math.sin(t / 11 + o.p)), a = Math.min(1, o.a * AMT);
      const gg = cx.createRadialGradient(x, y, 0, x, y, r), c = o.c.join(',');
      gg.addColorStop(0, `rgba(${c},${a})`); gg.addColorStop(.45, `rgba(${c},${a * .55})`); gg.addColorStop(1, `rgba(${c},0)`);
      cx.fillStyle = gg; cx.fillRect(0, 0, W, H);
    }
  };
  size(); addEventListener('resize', () => { size(); draw(clock()); });
  const T0 = performance.now() - 20000 * Math.random(), clock = () => (performance.now() - T0) / 1000;
  draw(clock());
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;   /* still light, no drift */
  const STEP = 1000 / 30; let last = 0;
  const tick = now => { if (now - last >= STEP) { last = now; draw(clock()); } requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
})();
/* the header gets a frosted backing only once the page has scrolled under it */
addEventListener('scroll', () => document.documentElement.classList.toggle('scrolled', scrollY > 2), { passive: true });
</script>
<script src="turn/meta-v13.js"></script>
<script>
(() => {
  /* META (from the render prep): one crop box shared by every frame of every robot, so scale and floor line up.
     box: [x0, y0, w, h] in render px; out: file px per render px; per robot: n frames, trim (empty share left/right of frame 0),
     trimQ/topQ (same for the last frame), dims (bumper width, depth in m). Camera B: 85 mm on a 36 mm sensor at 2000 px,
     eye 0.45 m, 4.5 m from the axis, horizon row 1300. */
  const M = window.META;
  const R = {
    /* link: the team's page for that robot (placeholder until Jarrett sends the real ones) */
    '2026': { name: 'Netherite', lines: ['NETHERITE'], link: 'https://www.thebluealliance.com/team/4639/2026' },
    '2025': { name: 'Heart of the Sea', lines: ['HEART OF', 'THE SEA'], em: 0.25, link: 'https://www.thebluealliance.com/team/4639/2025' },
    '2024': { name: 'Cadenza', lines: ['CADENZA'], em: 0.18, link: 'https://www.thebluealliance.com/team/4639/2024' },
  };
  const ORDER = ['2024', '2025', '2026'].filter(y => M.r[y]);   /* oldest on the left, newest on the right, next to the tile */
  const TILE = ORDER[ORDER.length - 1], TI = ORDER.length - 1;   /* the tile shows the newest robot; it flies out to its spot in the band */
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const phone = () => innerWidth <= 760;
  const $ = (s, el = document) => el.querySelector(s);
  const home = $('#home'), cs = $('#case'), row = $('#row'), band = $('#band'), tile = $('#robotsTile');
  let current = 'home', busy = false, open = false;
  const pad = i => String(i).padStart(3, '0');
  const BW = Math.round(M.box[2] * M.out), BH = Math.round(M.box[3] * M.out);   /* frame size in file px */
  /* Three frame sizes: 800 px for phones and the board's shrunken previews, 1200 px for ordinary
     desktop screens, the full 1606 px only for big retina screens. Each is as sharp as the screen can show and no bigger. ?k= is the scale the board draws this page at. */
  const KS = +(new URLSearchParams(location.search).get('k')) || 1;
  const NEED = Math.min(innerWidth, 1440) * 0.7 * (devicePixelRatio || 1) * KS;   /* about how many screen pixels wide the robot gets */

          const x = (D.x[f] + (D.x[f + 1] - D.x[f]) * (fp - f)) * cw;
          cv.style.transform = `translate3d(${(-x).toFixed(2)}px,0,0) scaleX(-1)`;
          if (f !== shown) { c2.clearRect(0, 0, cv.width, cv.height); c2.drawImage(ims[f], 0, 0); shown = f; }
          requestAnimationFrame(step);
        };
        step(t0);
      }));
    }).catch(() => null);
  }
  /* the entrance waits for the two pictures so nothing pops in halfway (gives up after three seconds), then up to 1.8 s more for the
     drive-in frames; on a slow line the page simply opens with the car already parked */
  if (document.documentElement.classList.contains('intro')) {
    const pics = [$('#car'), $('#tstage img')].filter(Boolean).map(im => im.decode ? im.decode().catch(() => {}) : 0);
    const de = document.documentElement, stage = $('#mstage'), t0 = performance.now();
    stage.classList.add('wip-wait');
    requestAnimationFrame(() => de.classList.add('lit'));   /* the light comes up first */
    const flicker = () => new Promise(done => { de.classList.add('wipped'); stage.classList.remove('wip-wait'); stage.classList.add('wip-flash'); setTimeout(() => { stage.classList.remove('wip-flash'); done(); }, 600); });
    let shown = false;
    const reveal = () => { if (shown) return; shown = true; stage.classList.remove('wip-wait', 'wip-flash');
      de.classList.add('play'); de.classList.remove('intro', 'rolling'); setTimeout(() => de.classList.remove('play'), 1500); };
    Promise.race([Promise.all(pics), wait(3000)]).then(() => { fit(); return Promise.race([driveIn(), wait(1800).then(() => null)]); })
      .then(drive => wait(Math.max(0, 1200 - (performance.now() - t0))).then(() => drive))   /* let the light settle a moment */
      .then(drive => { fit(); de.classList.add('rolling');
        return typeof drive === 'function' ? drive() : wait(1000); })   /* drives in and stops (or, if the frames were late, fades in parked) */
      .then(flicker).then(() => wait(350)).then(reveal);
    setTimeout(reveal, 12000);   /* never leave the page dark */
  }
  const h = location.hash.replace('#r', '');
  if (R[h] && M.r[h]) { hist('replace', { r: h }, location.href); home.hidden = true; cs.hidden = false; current = h;
    cs.innerHTML = caseHTML(h); layoutScene(); $('#ptext').classList.remove('off'); }
  else if (location.hash === '#band') setBand(true, { instant: true });
})();
</script>
